name: PRAMANA-V1 CI

on:
  push:
    branches:
      - fix/separate-login-portals
    paths:
      - '.github/workflows/pramana-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: pramana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: ci_test_only
        run: |
          psql -h localhost -U ci_user -d pramana_test -c "SELECT version();"

      - name: Patient access tests
        run: npm run test:access

      - name: Apply and exercise both migrations on PostgreSQL 17 fixture
        env:
          PRAMANA_TEST_POSTGRES: '1'
        run: npm run test:access

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint validation
        run: npx eslint .

      - name: Production build
        run: npm run build
